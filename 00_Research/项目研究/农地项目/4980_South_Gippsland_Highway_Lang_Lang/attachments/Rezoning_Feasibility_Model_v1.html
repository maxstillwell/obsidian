<body><div class="app">
<header class="top"><h1>Rezoning Feasibility Model</h1><p>Bass Coast 校准版 · 地块级筛选模型 · v1.0</p></header>
<div class="toolbar"><button class="primary" onclick="saveData(true)">保存</button><button onclick="exportJSON()">导出 JSON</button><label class="filebtn">导入 JSON<input type="file" accept="application/json" onchange="importJSON(this)"></label><button onclick="window.print()">打印 / PDF</button><button onclick="resetAll()">重置</button><span id="saveNote" style="align-self:center;color:#667788"></span></div>
<section class="summary">
 <div class="card outcome"><small>最终建议</small><strong id="overall">RESEARCH HOLD — 资料不足</strong></div>

];

 ['E01','Certificate of Title, plan and encumbrances','Title','Yes','Land Use Victoria',''],['E02','Current zone and overlay map','Statutory planning','Yes','VicPlan / Planning Maps Online','https://mapshare.vic.gov.au/vicplan/'],['E03','Current planning-scheme ordinance','Statutory planning','Yes','DTP','https://planning-schemes.app.planning.vic.gov.au/Bass%20Coast/ordinance'],['E04','Bass Coast Statement of Planning Policy 2025 and boundary map','Binding regional policy','Yes','DTP','https://www.planning.vic.gov.au/__data/assets/pdf_file/0017/761300/Bass-Coast-Statement-Policy-Oct2025.pdf'],['E05','Applicable structure plan / PSP / framework map','Strategic planning','Yes','Council / DTP','https://www.basscoast.vic.gov.au/building-planning/planning-scheme/precinct-structure-plans-and-reports'],['E06','Housing Strategy / land supply evidence','Strategic need','If residential','Bass Coast Shire',''],['E07','Industrial Land Use Strategy','Strategic need','If employment','Bass Coast Shire',''],['E08','Water and sewer servicing advice','Infrastructure','Yes','Westernport Water / South Gippsland Water',''],['E09','Drainage and flood / coastal inundation screen','Hazard','Yes','Council / CMA',''],['E10','Bushfire screen','Hazard','Yes','CFA / qualified consultant',''],['E11','Biodiversity and native vegetation screen','Environment','Yes','DEECA / ecologist',''],['E12','Landscape-significance and viewshed screen','Landscape','Yes','SPP / landscape study',''],['E13','Aboriginal cultural heritage / CHMP trigger screen','Cultural heritage','Yes','First Peoples–State Relations',''],['E14','Traffic, access and road-authority screen','Transport','Yes','Council / DTP Roads',''],['E15','Preliminary concept and gross developable area','Design/yield','Yes','Town planner / engineer',''],['E16','Council strategic-planning pre-application feedback','Process','Yes','Bass Coast Shire',''],['E17','Comparable rezonings and Panel reports','Precedent','Helpful','Planning Panels / Council',''],['E18','Market and residual-land-value test','Commercial','Yes','Valuer / development model','']
];
const phases=[['0. Desktop screen','确认是否值得投入下一步费用',0,1,5000,15000],['1. Pre-application','测试 authority 态度与所需研究',1,2,15000,40000],['2. Technical evidence','建立战略及技术依据',3,6,80000,250000],['3. Amendment request / authorisation','寻求正式 amendment 路径',9,6,60000,180000],['4. Exhibition and Panel','回应 submissions 及独立审查',15,9,100000,350000],['5. Ministerial approval / gazettal','完成法定 rezoning',24,6,30000,100000],['6. Post-rezoning planning','转化为可开发 approval',30,18,200000,1000000]];

let state={fields:{lga:'Bass Coast Shire',zone:'Farming Zone (FZ)',date:new Date().toISOString().slice(0,10)},gates:{},scores:{},evidence:{},phases:{}};

function inputFor(f){let [label,key,type,help]=f,v=state.fields[key]??'';if(type==='select'){return `<select data-field="${key}">${help.split('|').map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`}return `<input data-field="${key}" type="${type}" value="${esc(v)}" step="any"><div class="hint">${esc(help)}</div>`}
function render(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${t[0]}" class="${i?'':'active'}">${t[1]}</button>`).join('');document.getElementById('main').innerHTML=`
<section class="panel active" id="site"><h2>地块基本资料</h2><p class="intro">先确认准确 title、规划位置和目标用途。黄色栏均可填写。</p><div class="section"><h3>A. Property identity</h3><div class="grid">${fields.slice(0,12).map(f=>`<div class="field"><label>${f[0]}</label>${inputFor(f)}</div>`).join('')}</div></div><div class="section"><h3>B. Planning location</h3><div class="grid">${fields.slice(12).map(f=>`<div class="field"><label>${f[0]}</label>${inputFor(f)}</div>`).join('')}</div></div></section>
<section class="panel" id="gates"><h2>Stage 1 — Mandatory Gate Tests</h2><p class="intro">Fail 不能被高分抵消；Conditional 必须有解决方案；Unknown 会降低可信度。</p><div class="tablewrap"><table><thead><tr><th>ID</th><th>Mandatory test</th><th>Result</th><th>Why this is a gate</th><th>Evidence / finding</th><th>Required action</th></tr></thead><tbody>${gates.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td><td><select data-gate="${g[0]}">${['Unknown','Pass','Conditional','Fail'].map(x=>`<option ${state.gates[g[0]]?.result===x?'selected':''}>${x}</option>`).join('')}</select></td><td>${g[2]}</td><td><textarea data-gate-note="${g[0]}">${esc(state.gates[g[0]]?.note)}</textarea></td><td>${g[3]}</td></tr>`).join('')}</tbody></table></div><div class="resultbox" id="gateSummary"></div></section>
<section class="panel" id="score"><h2>Stage 2 — Weighted Strategic Score</h2><p class="intro">每项0–5分：0为致命弱点，3为中性／可解决，5为强支持。总权重100。</p><div class="tablewrap"><table><thead><tr><th>ID</th><th>Assessment dimension</th><th>Weight</th><th>Score 0–5</th><th>Points</th><th>0分</th><th>3分</th><th>5分</th><th>Evidence / reasoning</th></tr></thead><tbody>${criteria.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}%</td><td><input type="number" min="0" max="5" step="1" data-score="${c[0]}" value="${state.scores[c[0]]?.score??0}"></td><td id="pt-${c[0]}">0.0</td><td class="anchor">${c[3]}</td><td class="anchor">${c[4]}</td><td class="anchor">${c[5]}</td><td><textarea data-score-note="${c[0]}">${esc(state.scores[c[0]]?.note)}</textarea></td></tr>`).join('')}</tbody></table></div><div class="resultbox" id="scoreSummary"></div></section>
<section class="panel" id="evidence"><h2>Evidence Register</h2><p class="intro">只有对准确地块核对当前 primary source 或取得专业意见后，才标记 Complete。</p><div class="tablewrap"><table><thead><tr><th>ID</th><th>Evidence item</th><th>Category</th><th>Required?</th><th>Authority</th><th>URL / file</th><th>As-of date</th><th>Status</th><th>Site-specific finding</th></tr></thead><tbody>${evidence.map(e=>`<tr><td>${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td><td>${e[3]}</td><td>${e[4]}</td><td><input data-ev-url="${e[0]}" value="${esc(state.evidence[e[0]]?.url??e[5])}"></td><td><input type="date" data-ev-date="${e[0]}" value="${esc(state.evidence[e[0]]?.date)}"></td><td><select data-ev-status="${e[0]}">${['Not started','In progress','Complete','Not applicable'].map(x=>`<option ${state.evidence[e[0]]?.status===x?'selected':''}>${x}</option>`).join('')}</select></td><td><textarea data-ev-note="${e[0]}">${esc(state.evidence[e[0]]?.note)}</textarea></td></tr>`).join('')}</tbody></table></div></section>
<section class="panel" id="path"><h2>Rezoning Pathway, Timing & Cost Range</h2><p class="intro">仅作筛选假设；每个地块需由顾问和 authority 重新报价。</p><div class="tablewrap"><table><thead><tr><th>Phase</th><th>Purpose</th><th>Start month</th><th>Duration</th><th>Low cost</th><th>High cost</th></tr></thead><tbody>${phases.map((p,i)=>`<tr><td>${p[0]}</td><td>${p[1]}</td>${[2,3,4,5].map(j=>`<td><input type="number" data-phase="${i}-${j}" value="${state.phases[`${i}-${j}`]??p[j]}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="resultbox" id="pathSummary"></div><div class="notice">不包含土地购买、持有成本、基础设施工程、developer contributions、税费及施工成本。</div></section>

<section class="panel" id="guide"><h2>使用与迁移说明</h2><div class="notice"><strong>操作顺序：</strong>确认地块 → Gate Tests → 加权评分 → 证据补全 → 选择 amendment 路径 → 商业测算 → authority 沟通 → 更新结论。</div><div class="section"><h3>核心规则</h3><div class="grid">${[['Parcel first','始终核对准确 title，而不是只看地址或 locality。'],['Gates before scores','边界或致命风险不能用其他高分抵消。'],['Evidence, not intuition','每个 Pass 和3分以上判断应附当前证据。'],['Unknown is not neutral','未知项降低可信度，并可能触发 Research Hold。'],['Planning ≠ economics','能 rezoning 不代表扣除时间、基建和 contributions 后值得买。'],['Update through stages','每次取得新证据、pre-application 或 Panel 结果后更新。']].map(x=>`<div class="field"><label>${x[0]}</label>${x[1]}</div>`).join('')}</div></div><div class="section"><h3>迁移到其他 Council 时替换</h3><div class="grid"><div class="field">Binding regional policy / UGB / SPP</div><div class="field">Municipal strategic statement</div><div class="field">Housing / industrial land strategy</div><div class="field">Structure Plan / PSP</div><div class="field">Local zone / overlay schedules</div><div class="field">Water、drainage、road、CMA 等 authority</div></div></div></section>`;
 bind();calc();}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.querySelectorAll('[data-field]').forEach(x=>x.oninput=()=>{state.fields[x.dataset.field]=x.value;changed()});document.querySelectorAll('[data-gate]').forEach(x=>x.onchange=()=>{(state.gates[x.dataset.gate]??={}).result=x.value;changed()});document.querySelectorAll('[data-gate-note]').forEach(x=>x.oninput=()=>{(state.gates[x.dataset.gateNote]??={}).note=x.value;changed()});document.querySelectorAll('[data-score]').forEach(x=>x.oninput=()=>{(state.scores[x.dataset.score]??={}).score=Math.max(0,Math.min(5,+x.value||0));changed()});document.querySelectorAll('[data-score-note]').forEach(x=>x.oninput=()=>{(state.scores[x.dataset.scoreNote]??={}).note=x.value;changed()});['url','date','status','note'].forEach(k=>document.querySelectorAll(`[data-ev-${k}]`).forEach(x=>x.oninput=()=>{let id=x.dataset['ev'+k[0].toUpperCase()+k.slice(1)];(state.evidence[id]??={})[k]=x.value;changed()}));document.querySelectorAll('[data-phase]').forEach(x=>x.oninput=()=>{state.phases[x.dataset.phase]=+x.value||0;changed()})}
let timer;function changed(){calc();clearTimeout(timer);timer=setTimeout(()=>saveData(false),600)}
function calc(){let gr=gates.map(g=>state.gates[g[0]]?.result||'Unknown'),fails=gr.filter(x=>x==='Fail').length,conds=gr.filter(x=>x==='Conditional').length,unknown=gr.filter(x=>x==='Unknown').length;let gs=fails?'FAIL — STOP':unknown>=3?'INSUFFICIENT EVIDENCE':conds?'CONDITIONAL PASS':'PASS';let total=0;criteria.forEach(c=>{let s=state.scores[c[0]]?.score||0,p=c[2]*s/5;total+=p;let el=document.getElementById('pt-'+c[0]);if(el)el.textContent=p.toFixed(1)});let complete=evidence.filter(e=>(state.evidence[e[0]]?.status||'Not started')==='Complete').length,ep=complete/evidence.length;let overall=fails?'NO-GO — GATE FAILURE':unknown>=3?'RESEARCH HOLD — INSUFFICIENT EVIDENCE':total>=75?'PROMOTE / PRE-APPLICATION':total>=60?'CONDITIONAL — RESOLVE RISKS':total>=45?'WATCHLIST / OPTION ONLY':'DO NOT PURSUE';let conf=ep<.5?'LOW':ep<.8?'MEDIUM':'HIGH';set('overall',overall);set('gateStatus',gs);set('totalScore',total.toFixed(1));set('evidencePct',Math.round(ep*100)+'%');set('confidence',conf);let ov=document.getElementById('overall');ov.className=fails||overall.includes('DO NOT')?'status-bad':overall.includes('PROMOTE')?'status-good':'status-warn';set('gateSummary',`<strong>${gs}</strong><br>Fail: ${fails} · Conditional: ${conds} · Unknown: ${unknown}`);set('scoreSummary',`<strong>${total.toFixed(1)} / 100</strong> · ${total>=75?'STRONG':total>=60?'CONDITIONAL':total>=45?'WATCHLIST':'WEAK'}<br>Score 不会覆盖 Gate failure。`);let vals=phases.map((p,i)=>[2,3,4,5].map(j=>state.phases[`${i}-${j}`]??p[j])),low=vals.slice(0,6).reduce((a,x)=>a+x[2],0),high=vals.slice(0,6).reduce((a,x)=>a+x[3],0),months=Math.max(...vals.slice(0,6).map(x=>x[0]+x[1]));set('pathSummary',`<strong>Screening → Gazettal</strong><br>预计 ${months} months · 前期顾问费约 ${money(low)} – ${money(high)}`)}
function set(id,v){let e=document.getElementById(id);if(e)e.innerHTML=v}function money(n){return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n)}
function saveData(show){localStorage.setItem(STORAGE,JSON.stringify(state));if(show){set('saveNote','已保存到本浏览器');setTimeout(()=>set('saveNote',''),1800)}}
function exportJSON(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(state.fields.siteName||'Rezoning_Assessment').replace(/[^a-z0-9_-]+/gi,'_')+'.json';a.click();URL.revokeObjectURL(a.href)}
function importJSON(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);saveData(false);render()}catch(e){alert('JSON 文件无法读取')} };r.readAsText(f);el.value=''}
function resetAll(){if(confirm('确定清空当前模型吗？建议先导出 JSON 备份。')){localStorage.removeItem(STORAGE);location.reload()}}
try{let old=localStorage.getItem(STORAGE);if(old)state=JSON.parse(old)}catch(e){}render();
</script></body></html>
