<text x="90" y="120" class="title" text-anchor="start">澳洲夏威夷果行业科普报告</text>
<text x="90" y="170" class="body" text-anchor="start" fill="#d8e7ef">Investor Primer • 2026</text>
<text x="90" y="235" class="h2" text-anchor="start" fill="#ffffff">这不是一篇纯行业分析，而是一份给投资人的“读懂产业”说明书。</text>
<text x="90" y="272" class="body" text-anchor="start" fill="#d8e7ef">聚焦：产区地图、产业链、关键数据、价格逻辑、经营 benchmark 与投资要点。</text>
