<text x="120" y="640" class="h2" text-anchor="start" fill="#ffffff">核心判断</text>
<text x="120" y="680" class="body" text-anchor="start" fill="#e5eef5">澳洲坚果是一种“长周期、重管理、出口导向”的树果资产。真正决定回报的，不只是土地，而是园龄、单产、核仁回收率、灌溉与加工效率。</text>
<text x="120" y="725" class="tiny" text-anchor="start" fill="#bdd1de">Sources: Australian Macadamias Yearbook 2025 · Benchmark Report 2024 · your internal farm valuation notes</text>
