<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f2a"/>
      <stop offset="100%" stop-color="#123b52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7bd389"/>
      <stop offset="100%" stop-color="#f2c14e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { font: 700 54px 'Arial', 'Microsoft YaHei', sans-serif; fill: #ffffff; }
      .h1 { font: 700 32px 'Arial', 'Microsoft YaHei', sans-serif; fill: #0b1f2a; }
      .h2 { font: 700 22px 'Arial', 'Microsoft YaHei', sans-serif; fill: #0b1f2a; }
      .body { font: 400 18px 'Arial', 'Microsoft YaHei', sans-serif; fill: #1f2937; }
      .small { font: 400 14px 'Arial', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .tiny { font: 400 12px 'Arial', 'Microsoft YaHei', sans-serif; fill: #6b7280; }
      .badgeN { font: 700 30px 'Arial', 'Microsoft YaHei', sans-serif; fill: #0b1f2a; }
      .badgeL { font: 600 15px 'Arial', 'Microsoft YaHei', sans-serif; fill: #0b1f2a; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

<rect x="70" y="70" width="1460" height="760" rx="30" fill="#f8fafc" filter="url(#shadow)"/>
<text x="110" y="125" class="h1" text-anchor="start">澳洲坚果价值链：从土地到出口</text>
<text x="110" y="160" class="small" text-anchor="start">投资人要看的不是单点数据，而是整条链条是否顺畅。</text>
<rect x="110" y="270" width="190" height="180" rx="22" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
<rect x="110" y="270" width="190" height="12" rx="6" fill="#0ea5a3"/>
<text x="205" y="325" class="h2" text-anchor="middle">土地 / 水权</text>
<text x="205" y="370" class="small" text-anchor="middle">地块、灌溉、排水、进入性</text>
<path d="M300 360 L330 360" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
<polygon points="330,352 330,368 350,360" fill="#64748b"/>
<rect x="340" y="270" width="190" height="180" rx="22" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
<rect x="340" y="270" width="190" height="12" rx="6" fill="#f2c14e"/>
<text x="435" y="325" class="h2" text-anchor="middle">种植 / 养树</text>
<text x="435" y="370" class="small" text-anchor="middle">树龄、密度、品种、成活率</text>
<path d="M530 360 L560 360" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
<polygon points="560,352 560,368 580,360" fill="#64748b"/>
<rect x="570" y="270" width="190" height="180" rx="22" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
<rect x="570" y="270" width="190" height="12" rx="6" fill="#0ea5a3"/>
<text x="665" y="325" class="h2" text-anchor="middle">果园管理</text>
<text x="665" y="370" class="small" text-anchor="middle">修剪、施肥、病虫害、地面管理</text>
<path d="M760 360 L790 360" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
<polygon points="790,352 790,368 810,360" fill="#64748b"/>
<rect x="800" y="270" width="190" height="180" rx="22" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
<rect x="800" y="270" width="190" height="12" rx="6" fill="#f2c14e"/>
<text x="895" y="325" class="h2" text-anchor="middle">采收 / 运输</text>
<text x="895" y="370" class="small" text-anchor="middle">机械化、天气窗口、损耗</text>
<path d="M990 360 L1020 360" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
<polygon points="1020,352 1020,368 1040,360" fill="#64748b"/>
<rect x="1030" y="270" width="190" height="180" rx="22" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
<rect x="1030" y="270" width="190" height="12" rx="6" fill="#0ea5a3"/>
<text x="1125" y="325" class="h2" text-anchor="middle">加工 / 分级</text>
<text x="1125" y="370" class="small" text-anchor="middle">NIS -> kernel、SKR、RKR</text>
<path d="M1220 360 L1250 360" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
<polygon points="1250,352 1250,368 1270,360" fill="#64748b"/>
<rect x="1260" y="270" width="190" height="180" rx="22" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
<rect x="1260" y="270" width="190" height="12" rx="6" fill="#f2c14e"/>
<text x="1355" y="325" class="h2" text-anchor="middle">销售 / 出口</text>
<text x="1355" y="370" class="small" text-anchor="middle">国内 + 亚洲 + 欧美市场</text>
<rect x="110" y="520" width="1360" height="220" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="145" y="570" class="h2" text-anchor="start">投资判断四件事</text>
<text x="145" y="620" class="body" text-anchor="start">1. 这块地有没有稳定的水？</text>
<text x="145" y="655" class="body" text-anchor="start">2. 果园是不是已经进入稳定挂果区间？</text>
<text x="145" y="690" class="body" text-anchor="start">3. 单产、回收率和成本能不能跑赢行业平均？</text>
<text x="145" y="725" class="body" text-anchor="start">4. 下行时这块资产还能保住多少残值？</text>
<text x="110" y="790" class="tiny" text-anchor="start">用于报告中作为“产业逻辑总图”页。</text>
</svg>